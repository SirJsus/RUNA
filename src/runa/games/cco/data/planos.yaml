# Las losetas de la mazmorra (paginas 32 y 33-37 del reglamento).
#
# IMPORTANTE: en el libro son dibujos a mano sobre papel cuadriculado, con
# formas irregulares y dos que son circulos. Esto es una transcripcion A OJO:
# las proporciones y el numero de salidas son fieles, pero la silueta exacta de
# las mas retorcidas es una aproximacion. Corregir una loseta es editar su
# bloque `forma`; el dibujo se adapta solo.
#
#   forma    `#` es suelo transitable y `.` es roca. La fila de arriba es
#            y=0 y la columna de la izquierda x=0.
#   salidas  "x,y,lado" con una puerta. Lado: N (arriba), S, E (derecha), O.
#   aberturas  igual, pero paso franco sin puerta (los corredores del libro
#            que se salen del dibujo).

entradas:

  "1":
    tipo: habitacion
    forma: |
      ####
      ####
    salidas: ["0,0,N", "2,0,N", "1,1,S"]

  "2":
    tipo: habitacion
    forma: |
      ###
      ###
    salidas: ["0,0,N", "2,1,E", "1,1,S"]
    aberturas: ["1,0,N"]

  "3":
    tipo: corredor
    forma: |
      #.#
      ###
    aberturas: ["0,0,N", "2,0,N"]

  "4":
    tipo: habitacion
    forma: |
      ###
      ###
    aberturas: ["1,0,N", "0,1,O", "2,1,E"]

  "5":
    tipo: corredor
    forma: |
      #
      #
      #
    aberturas: ["0,0,N"]

  "6":
    tipo: habitacion
    forma: |
      ###
      ###
    salidas: ["1,1,S"]
    aberturas: ["0,0,N"]

